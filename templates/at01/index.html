<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade 01</title>
  </head>
  <body>
    <!-- 
    Atividade 1: criar rota web html com a tag canvas onde o usuário pode 
    deslocar uma foto para a esquerda e direita com as setas do teclado
    -->
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
      const FETCH_URL = "http://127.0.0.1:5000";
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");
      const img = new Image();
      img.src = `${FETCH_URL}/static/imgs/placeholder.png`;
      img.onload = () => {
        context.drawImage(img, 0, 0, 800, 600);
      };
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          context.clearRect(0, 0, 800, 600);
          context.drawImage(img, 10, 0, 800, 600);
        } else if (event.key === "ArrowLeft") {
          context.clearRect(0, 0, 800, 600);
          context.drawImage(img, -10, 0, 800, 600);
        }
      });
    </script>
  </body>
</html>
