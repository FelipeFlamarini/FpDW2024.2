<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-blog Pessoal</title>
    <script src="/static/scripts/tailwind.js"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto mt-8">
        <form id="submitForm" class="mb-8">
            <textarea name="content" placeholder="Escreva seu post aqui..."
                class="w-full p-4 border border-gray-300 rounded-lg mb-4"></textarea>
            <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded-lg">Adicionar Post</button>
        </form>
        {% for post in posts %}
        <div class="bg-white p-6 rounded-lg shadow-md mb-4">
            <p class="text-gray-800">{{ post.content }}</p>
            <p class="text-gray-500 text-sm mt-2">{{ post.date.strftime('%d-%m-%Y %H:%M:%S') }}</p>
        </div>
        {% endfor %}
    </div>
    <script>
        document.querySelector("#submitForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            fetch("/exam/ex01/add", {
                method: "POST",
                body: formData
            }).then((response) => {
                if (response.ok) {
                    window.location.reload();
                }
            });
        });
    </script>
</body>

</html>
