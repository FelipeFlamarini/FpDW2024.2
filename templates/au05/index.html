<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação</title>
    <script src="http://127.0.0.1:5000/static/scripts/tailwind.js"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        {% if session['username']%}
        <form action="/logout" class="bg-white flex justify-center items-center flex-col">
            <h1 class="text-2xl font-bold mb-4">Bem-vindo, {{session['username']}}</h1>
            <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700">Logout</button>
        </form>
        {% else %}
        <h2 class="text-2xl font-bold mb-6 text-center">Formulário de Autenticação</h2>
        <form id="authForm" action="/auth" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Usuário:</label>
                <input type="text" id="username" name="username" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Senha:</label>
                <input type="password" id="password" name="password" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Entrar</button>
            </div>
        </form>
        <div id="message" class="mt-4 text-center text-sm"></div>
        {% endif %}
    </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: formData
            })
                .then(response => {
                    const messageDiv = document.getElementById('message');

                    if (response.ok) {
                        messageDiv.textContent = 'Autenticação bem-sucedida!';
                        messageDiv.className = 'mt-4 text-center text-sm text-green-600';
                    } else {
                        messageDiv.textContent = 'Falha na autenticação. Por favor, tente novamente.';
                        messageDiv.className = 'mt-4 text-center text-sm text-red-600';

                    }
                })
                .catch(error => {
                    const messageDiv = document.getElementById('message');
                    messageDiv.textContent = 'Erro ao tentar autenticar. Por favor, tente novamente.';
                    messageDiv.className = 'mt-4 text-center text-sm text-red-600';
                });
        });
    </script>
</body>

</html>
