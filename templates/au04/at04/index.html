<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerando um template</title>
    <script src="http://127.0.0.1:5000/static/scripts/tailwind.js"></script>
</head>

<body class="max-w-sm mx-auto mt-4 space-y-8">
    <h1 class="mx-auto w-max text-3xl">Crie seu template de livro</h1>
    <form id="templateForm" action="/au04/at04" method="post" class="grid grid-cols-1 space-y-4">
        <input type="text" required class="border border-black p-1 rounded" placeholder="Título" name="title">
        <input type="text" required class="border border-black p-1 rounded" placeholder="Autor" name="author">
        <input type="text" required class="border border-black p-1 rounded" placeholder="Descrição" name="description">
        <input type="text" required class="border border-black p-1 rounded" placeholder="Gêneros (separe por vírgula)"
            name="genres">
        <input type="date" required class="border border-black p-1 rounded" placeholder="Data de publicação"
            name="published_date">
        <button type="submit" class="p-1 rounded bg-green-500 w-full">Enviar</button>
    </form>
    <script>
        document.querySelector("#templateForm").addEventListener("submit", function (event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: formData
            }).then((response) => { console.log(response) })
        });
    </script>
</body>

</html>
